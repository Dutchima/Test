<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dutch Associates — Architecture &amp; Spatial Design</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap');

:root {
  --white: #FFFFFF;
  --off-white: #FAF9F6;
  --ink: #111111;
  --muted: #767676;
  --line: rgba(0, 0, 0, 0.08);
  --line-lt: rgba(255, 255, 255, 0.15);
  --ease-arch: cubic-bezier(0.25, 1, 0.35, 1);
}

*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--white); color:var(--ink); font-family:'Inter',sans-serif; font-size:15px; line-height:1.7; font-weight:300; -webkit-font-smoothing:antialiased;}
::selection{background:var(--ink); color:var(--white);}

h1,h2,h3,h4{font-family:'Playfair Display',serif; font-weight:400; line-height:1.15; color:var(--ink);}
a{color:inherit; text-decoration:none;}
img{display:block; width:100%; height:100%; object-fit:cover;}
button{font-family:inherit; cursor:pointer; background:none; border:none;}

/* CURSOR */
.cursor-dot, .cursor-ring{position:fixed; top:0; left:0; pointer-events:none; z-index:9999; border-radius:50%; transform:translate(-50%,-50%); will-change:transform;}
.cursor-dot{width:4px; height:4px; background:var(--ink); transition:opacity .2s;}
.cursor-ring{width:30px; height:30px; border:1px solid rgba(0,0,0,0.3); transition:width .3s var(--ease-arch), height .3s var(--ease-arch), opacity .2s; opacity:0.6;}
.cursor-ring.hover{width:50px; height:50px; border-color:var(--ink); background:rgba(0,0,0,0.02);}
@media(pointer:coarse){.cursor-dot,.cursor-ring{display:none;}}
body.has-cursor{cursor:none;}
body.has-cursor a, body.has-cursor button, body.has-cursor .proj-card, body.has-cursor .ct-tile{cursor:none;}

/* ARCHITECTURAL REVEAL MOTION */
.reveal {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 1.2s var(--ease-arch), transform 1.2s var(--ease-arch);
  transition-delay: calc(var(--d, 0) * 100ms);
  will-change: opacity, transform;
}
.reveal.in {
  opacity: 1;
  transform: translateY(0);
}

.reveal-img-wrap {
  overflow: hidden;
  position: relative;
}
.reveal-img-wrap img {
  transform: scale(1.08);
  transition: transform 1.6s var(--ease-arch);
  will-change: transform;
}
.reveal.in .reveal-img-wrap img {
  transform: scale(1);
}

/* HEADER — Sparse, invisible chrome */
.site-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 300;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 60px;
  transition: padding 0.4s var(--ease-arch);
}
.brand-name {
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink);
}
.menu-toggle {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 0;
}
.menu-toggle span {
  width: 28px;
  height: 1px;
  background: var(--ink);
  display: block;
  transition: transform 0.3s var(--ease-arch), width 0.3s var(--ease-arch);
}
.menu-toggle:hover span:last-child {
  width: 18px;
}

@media(max-width:768px){
  .site-header { padding: 20px 24px; }
}

/* NAV OVERLAY */
.nav-overlay {
  position: fixed;
  inset: 0;
  background: var(--ink);
  color: var(--white);
  z-index: 500;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 60px 8%;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s var(--ease-arch);
}
.nav-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.nav-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.nav-close {
  color: var(--white);
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  opacity: 0.6;
  transition: opacity 0.3s;
}
.nav-close:hover { opacity: 1; }

.overlay-links {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.overlay-links a {
  font-family: 'Playfair Display', serif;
  font-size: clamp(32px, 5vw, 64px);
  color: var(--white);
  opacity: 0.4;
  transition: opacity 0.4s var(--ease-arch), transform 0.4s var(--ease-arch);
  display: inline-block;
}
.overlay-links a:hover {
  opacity: 1;
  transform: translateX(12px);
}
.overlay-contact {
  display: flex;
  gap: 40px;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  opacity: 0.5;
}

/* BUTTONS — Pure restraint */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-weight: 400;
  padding: 16px 0;
  color: var(--ink);
  position: relative;
  transition: color 0.3s var(--ease-arch);
}
.btn::after {
  content: '';
  position: absolute;
  bottom: 12px;
  left: 0;
  width: 100%;
  height: 1px;
  background: var(--ink);
  transform: scaleX(0.2);
  transform-origin: left;
  transition: transform 0.4s var(--ease-arch);
}
.btn:hover::after {
  transform: scaleX(1);
}

.view { display: none; }
.view.active { display: block; }

/* SPATIAL SCROLLING RHYTHM */

/* RHYTHM 1: Full Immersive Hero */
.hero-spatial {
  position: relative;
  height: 100vh;
  width: 100%;
  display: flex;
  align-items: flex-end;
  padding: 0 8% 80px;
}
.hero-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.hero-bg img {
  filter: brightness(0.9);
}
.hero-title-group {
  position: relative;
  z-index: 2;
  color: var(--white);
  max-width: 900px;
}
.hero-title-group h1 {
  color: var(--white);
  font-size: clamp(40px, 6.5vw, 96px);
  font-weight: 300;
  letter-spacing: -0.02em;
  line-height: 1.05;
  margin-bottom: 24px;
}
.hero-meta {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  opacity: 0.8;
}

/* RHYTHM 2: Generous Typographic Pause */
.space-pause-typo {
  padding: 240px 12% 160px;
  max-width: 1400px;
}
.space-pause-typo blockquote {
  font-family: 'Playfair Display', serif;
  font-size: clamp(28px, 3.8vw, 54px);
  line-height: 1.25;
  color: var(--ink);
  font-weight: 400;
}

/* RHYTHM 3: Asymmetric Image-Led Composition */
.space-asymmetric-image {
  padding: 80px 8% 180px;
  display: grid;
  grid-template-columns: 7fr 4fr;
  gap: 8%;
  align-items: flex-end;
}
.asym-img-main {
  height: 80vh;
}
.asym-meta {
  padding-bottom: 40px;
}
.asym-meta h3 {
  font-size: 32px;
  margin-bottom: 16px;
}
.asym-meta p {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.8;
  margin-bottom: 24px;
}

/* RHYTHM 4: Full-Bleed Spatial Image */
.space-full-bleed {
  padding: 0;
  width: 100%;
  height: 90vh;
}

/* RHYTHM 5: Dual Dynamic Heights */
.space-dual-grid {
  padding: 200px 8% 120px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
}
.dual-col-1 { margin-top: 0; }
.dual-col-2 { margin-top: 140px; }
.dual-card .img-wrap {
  height: 65vh;
  margin-bottom: 20px;
}
.dual-card h4 {
  font-size: 22px;
  margin-bottom: 6px;
}
.dual-card span {
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
}

/* CATEGORIES SPATIAL FLOW */
.space-categories {
  padding: 160px 8% 220px;
}
.space-categories-header {
  margin-bottom: 80px;
}
.space-categories-header h2 {
  font-size: clamp(36px, 4vw, 64px);
}
.cat-list {
  display: flex;
  flex-direction: column;
}
.cat-item {
  display: grid;
  grid-template-columns: 1fr 2fr 1fr;
  align-items: center;
  padding: 40px 0;
  border-top: 1px solid var(--line);
  transition: border-color 0.4s;
}
.cat-item:last-child {
  border-bottom: 1px solid var(--line);
}
.cat-item:hover {
  border-color: var(--ink);
}
.cat-item h3 {
  font-size: clamp(20px, 2.5vw, 36px);
}
.cat-item .cat-count {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.1em;
}
.cat-item .cat-link {
  text-align: right;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

@media(max-width:860px){
  .space-pause-typo { padding: 120px 8% 80px; }
  .space-asymmetric-image { grid-template-columns: 1fr; gap: 40px; padding: 40px 8% 100px; }
  .asym-img-main { height: 50vh; }
  .space-dual-grid { grid-template-columns: 1fr; gap: 60px; padding: 80px 8%; }
  .dual-col-2 { margin-top: 0; }
  .dual-card .img-wrap { height: 50vh; }
  .cat-item { grid-template-columns: 1fr 1fr; gap: 10px; }
  .cat-item .cat-count { display: none; }
}

/* LISTING VIEW */
.listing-head {
  padding: 180px 8% 80px;
  max-width: 900px;
}
.breadcrumb {
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 24px;
  display: flex;
  gap: 8px;
}
.breadcrumb a { cursor: pointer; }
.breadcrumb a:hover { color: var(--ink); }
.listing-head h2 {
  font-size: clamp(36px, 5vw, 72px);
  margin-bottom: 20px;
}
.listing-head p {
  color: var(--muted);
  font-size: 16px;
  line-height: 1.8;
}

.proj-grid {
  padding: 0 8% 160px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 80px 40px;
}
.proj-card .img-wrap {
  height: 70vh;
  margin-bottom: 24px;
}
.proj-card h3 {
  font-size: 24px;
  margin-bottom: 6px;
}
.proj-card p {
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}

@media(max-width:768px){
  .proj-grid { grid-template-columns: 1fr; gap: 60px; }
  .proj-card .img-wrap { height: 50vh; }
}

/* CONSULTATION & PRICING — Quiet Minimalist Layout */
.price-grid {
  padding: 0 8% 160px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 40px;
}
.price-card {
  padding: 60px 40px;
  border-top: 1px solid var(--ink);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.price-card h3 {
  font-size: 24px;
  margin-bottom: 12px;
}
.price-tag {
  font-family: 'Playfair Display', serif;
  font-size: 42px;
  margin-bottom: 24px;
}
.price-note {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 40px;
  line-height: 1.6;
}
.price-card ul {
  list-style: none;
  margin-bottom: 60px;
}
.price-card li {
  font-size: 13px;
  color: var(--muted);
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}

@media(max-width:960px){
  .price-grid { grid-template-columns: 1fr; gap: 60px; }
}

/* WIZARD — Architectural Linear Flow */
.wizard-shell {
  padding: 0 8% 160px;
  max-width: 800px;
}
.wizard-progress {
  display: flex;
  gap: 12px;
  margin-bottom: 60px;
}
.wizard-progress .dot {
  height: 2px;
  flex: 1;
  background: var(--line);
  transition: background 0.4s;
}
.wizard-progress .dot.active {
  background: var(--ink);
}
.wizard-step { display: none; }
.wizard-step.active { display: block; }
.step-label {
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
  display: block;
}
.wizard-step h3 {
  font-size: 32px;
  margin-bottom: 40px;
}
.field {
  margin-bottom: 40px;
}
.field label {
  display: block;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
}
.field input, .field textarea {
  width: 100%;
  border: none;
  border-bottom: 1px solid var(--line);
  padding: 16px 0;
  font-family: inherit;
  font-size: 18px;
  background: none;
  outline: none;
  transition: border-color 0.3s;
}
.field input:focus, .field textarea:focus {
  border-color: var(--ink);
}
.option-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin-bottom: 40px;
}
.option-card {
  padding: 24px;
  border: 1px solid var(--line);
  font-size: 14px;
  transition: border-color 0.3s;
  cursor: pointer;
}
.option-card.selected {
  border-color: var(--ink);
  background: var(--off-white);
}
.wizard-nav {
  display: flex;
  justify-content: space-between;
  margin-top: 60px;
}

/* FOOTER */
footer {
  padding: 80px 8%;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
}

/* LIGHTBOX MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: var(--white);
  z-index: 1000;
  display: opacity;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s var(--ease-arch);
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.modal-container {
  height: 100%;
  display: grid;
  grid-template-columns: 7fr 4fr;
}
.modal-media {
  height: 100vh;
  padding: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-media img {
  max-height: 100%;
  object-fit: contain;
}
.modal-info {
  padding: 120px 60px 60px 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.modal-close {
  position: absolute;
  top: 40px;
  right: 60px;
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

@media(max-width:960px){
  .modal-container { grid-template-columns: 1fr; }
  .modal-info { padding: 20px 40px 40px; }
  .modal-media { height: 60vh; padding: 20px; }
}
</style>
</head>
